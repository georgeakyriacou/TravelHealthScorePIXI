<!-- SQUARESPACE EMBED CODE FOR PIXI CALCULATOR -->
<!-- Instructions:
1. In Squarespace, add a "Code Block" where you want the calculator
2. Copy and paste this entire code
3. Replace YOUR_PUBLISHED_URL_HERE with your actual Replit published URL
4. Save and publish your Squarespace page
-->

<div style="width: 100%; max-width: 1200px; margin: 0 auto;">
  <iframe 
    id="pixi-calculator-iframe"
    src="YOUR_PUBLISHED_URL_HERE"
    width="100%"
    style="border: none; overflow: hidden; min-height: 800px; transition: height 0.3s ease; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);"
    scrolling="no"
    title="PIXI Travel Content Health Score Calculator"
  ></iframe>
</div>

<script>
(function() {
  // Auto-resize iframe based on content height
  window.addEventListener('message', function(event) {
    // Listen for height updates from the calculator
    if (event.data && event.data.type === 'iframe-resize') {
      var iframe = document.getElementById('pixi-calculator-iframe');
      if (iframe && event.data.height) {
        // Update iframe height with smooth transition
        iframe.style.height = event.data.height + 'px';
      }
    }
  }, false);
  
  // Set initial height after iframe loads
  var iframe = document.getElementById('pixi-calculator-iframe');
  if (iframe) {
    iframe.onload = function() {
      // Give it a moment for the content to render
      setTimeout(function() {
        iframe.contentWindow.postMessage({ type: 'get-height' }, '*');
      }, 500);
    };
  }
})();
</script>

<style>
/* Styling for the calculator iframe */
#pixi-calculator-iframe {
  display: block;
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

/* Responsive adjustments */
@media (max-width: 768px) {
  #pixi-calculator-iframe {
    min-height: 1000px;
    border-radius: 12px;
  }
}
</style>
